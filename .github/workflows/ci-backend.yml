name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
          POSTGRES_DB: c216
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216
      TEST_DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Create test database
        run: |
          PGPASSWORD=c216 psql \
            -h localhost \
            -U c216 \
            -d c216 \
            -c "CREATE DATABASE c216_test;"

      - name: Run tests
        working-directory: backend
        run: poetry run pytest

      - name: Run lint
        working-directory: backend
        run: poetry run ruff check .